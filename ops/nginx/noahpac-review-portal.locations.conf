    # Clinical Review Portal API — Authelia identity is forwarded only by Nginx.
    location ^~ /review/api/ {
        auth_request            /internal/authelia/authz;
        set $authelia_rd        "https://www.noahpac.com/authelia/?rd=https://www.noahpac.com$request_uri";
        error_page 401 =302     $authelia_rd;
        auth_request_set        $review_user $upstream_http_remote_user;

        rewrite ^/review/api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Remote-User $review_user;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        limit_req zone=noahpac burst=10 nodelay;
        limit_req_status 429;
    }

    # Clinical Review Portal frontend — private, no indexing, no caching.
    location ^~ /review/ {
        auth_request            /internal/authelia/authz;
        set $authelia_rd        "https://www.noahpac.com/authelia/?rd=https://www.noahpac.com$request_uri";
        error_page 401 =302     $authelia_rd;

        alias /var/www/noahpac-portal/clinical-review/;
        index index.html;
        try_files $uri $uri/ =404;
        limit_req zone=noahpac burst=30 nodelay;
        limit_req_status 429;
        include snippets/noahpac-security-headers.conf;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    }
