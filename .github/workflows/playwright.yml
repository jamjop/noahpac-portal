name: Clinical Site Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: clinical-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Static integrity and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser
        working-directory: tests
        run: pnpm exec playwright install chromium --with-deps

      - name: Check internal routes and assets
        run: node scripts/check-site-health.mjs --local

      - name: Run Playwright tests
        working-directory: tests
        run: bash run-tests.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
